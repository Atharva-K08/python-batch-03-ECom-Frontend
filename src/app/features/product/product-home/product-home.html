<div class="position-relative">
  <div class="position-absolute bg-danger">
    <div id="carouselExample" class="carousel slide">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img
            src="https://m.media-amazon.com/images/I/61Z5DaOEVeL._SX3000_.jpg"
            class="d-block w-100"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://m.media-amazon.com/images/I/81L5P7EuB-L._SX3000_.jpg"
            class="d-block w-100"
            alt="..."
          />
        </div>
        <div class="carousel-item">
          <img
            src="https://m.media-amazon.com/images/I/71qcoYgEhzL._SX3000_.jpg"
            class="d-block w-100"
            alt="..."
          />
        </div>
      </div>
      <button
        class="carousel-control-prev align-items-start pt-5"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon pt-5 mt-5" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
      </button>
      <button
        class="carousel-control-next align-items-start pt-5"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon pt-5 mt-5" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
      </button>
    </div>
  </div>
  <div class="position-absolute p-5 w-100 blur-banner"></div>
  <div class="position-absolute product-catlog w-100">
    <div class="row">
      @for (item of items; track $index) {
        <div class="col">
          <div class="card">
            product
          </div>
        </div>
      }
    </div>
  </div>
</div>
